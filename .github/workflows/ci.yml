name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Une seule exécution par branche : un nouveau push annule le run précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (src + test)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Aucun secret n'est nécessaire : la suite n'ouvre aucune connexion IMAP
      # ou SMTP et force ENABLE_SENDING=false (voir test/helpers/env.ts).
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
