name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Une seule exécution par branche : un nouveau push annule le run précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (src + test)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Aucun secret n'est nécessaire : la suite n'ouvre aucune connexion IMAP
      # ou SMTP et force ENABLE_SENDING=false (voir test/helpers/env.ts).
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Build de l'image Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Construit exactement comme la release (linux/amd64), sans pousser :
      # un Dockerfile cassé fait échouer le CI au lieu de passer inaperçu.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: icloud-mail-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # L'entrypoint réel démarrerait un serveur en attente : on se contente de
      # vérifier que l'artefact compilé est bien là et se charge sans erreur.
      - name: Smoke test de l'image
        run: |
          docker run --rm icloud-mail-mcp:ci \
            node --input-type=module -e "import('/app/dist/version.js').then(m => process.exit(m.serverVersion ? 0 : 1))"
