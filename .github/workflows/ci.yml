name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Une seule exécution par branche : un nouveau push annule le run précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit all dependencies
        run: npm audit

      - name: Typecheck (src + test)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Aucun secret n'est nécessaire : la suite n'ouvre aucune connexion IMAP
      # ou SMTP et force ENABLE_SENDING=false (voir test/helpers/env.ts).
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Construit exactement comme la release (linux/amd64), sans pousser :
      # un Dockerfile cassé fait échouer le CI au lieu de passer inaperçu.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: icloud-mail-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # L'entrypoint réel démarrerait un serveur en attente : on se contente de
      # vérifier que l'artefact compilé est bien là et se charge sans erreur.
      - name: Smoke test de l'image
        run: |
          docker run --rm icloud-mail-mcp:ci \
            node --input-type=module -e "import('/app/dist/version.js').then(m => process.exit(m.serverVersion ? 0 : 1))"

  secrets:
    name: Scan full Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks and scan all refs
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$scan_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scan_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git --redact --log-opts='--all' --exit-code=1 .
