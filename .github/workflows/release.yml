name: Release

# Se déclenche après un run vert du workflow CI sur main (donc après chaque
# merge). semantic-release analyse les commits Conventional Commits depuis le
# dernier tag, décide s'il y a une release, bump package.json/package-lock.json,
# ajoute l'entrée de CHANGELOG.md et les commite sur main (`chore(release): X.Y.Z [skip ci]`), tague ce commit,
# crée la GitHub Release ; si une release a eu lieu, le job docker pousse
# l'image sur GHCR taguée avec la nouvelle version.
#
# Release metadata is pushed with a dedicated SSH write deploy key. Configure
# any branch/ruleset bypass explicitly and restrict it to this release path.
# GITHUB_TOKEN is used for the GitHub Release API.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    # `event == 'push'` : ignore les runs CI déclenchés par une pull request
    # dont la branche source s'appellerait aussi `main` (fork).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      version: ${{ steps.semrel.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      # The write key is provisioned only after dependencies are installed without lifecycle
      # scripts. A second actions/checkout with `ssh-key` changes the remote URL, which makes it
      # wipe the workspace (node_modules included), so the key is set up by hand instead.
      - name: Configure SSH write key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_DEPLOY_KEY" ] || { echo "::error::RELEASE_DEPLOY_KEY required"; exit 1; }
          umask 077
          ssh_dir="$RUNNER_TEMP/release-ssh"
          mkdir -p "$ssh_dir"
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$ssh_dir/deploy_key"
          curl -fsSL https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          [ -s "$ssh_dir/known_hosts" ] || { echo "::error::GitHub SSH host keys unavailable"; exit 1; }
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config --local core.sshCommand \
            "ssh -i $ssh_dir/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o GlobalKnownHostsFile=/dev/null"

      - name: semantic-release
        id: semrel
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove SSH write key
        if: always()
        run: rm -rf "$RUNNER_TEMP/release-ssh"

  docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Des permissions au niveau du job remplacent celles du workflow :
    # `contents: read` reste nécessaire pour le checkout.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: v${{ needs.release.outputs.version }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Connexion à GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.release.outputs.version, '-') }}

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [release, docker]
    if: needs.release.outputs.released == 'true'
    permissions: {}
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
