name: Deploy
run-name: 'Deploy ${{ inputs.version }}'

# Called explicitly after GHCR publication; GITHUB_TOKEN release events do not start workflows.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_PORT:
        required: false
      DEPLOY_USER:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version à déployer (X.Y.Z ou 'latest')"
        default: latest
        required: true
        type: string

permissions: {}
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Déployer via SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] && [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KNOWN_HOSTS" ] || {
            echo "::error::DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER / DEPLOY_KNOWN_HOSTS required"
            exit 1
          }
          v="${VERSION#v}"
          [[ "$v" =~ ^(latest|[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::Invalid deployment version"; exit 1; }
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]] || exit 1
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || exit 1
          port="${SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 )) || exit 1
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/deploy_key" -p "$port" \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "$v"
