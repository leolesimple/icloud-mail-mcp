services:
  icloud-mail-mcp:
    # Image publiée sur GHCR à chaque tag `v*` (voir .github/workflows/release.yml).
    # Fixer ICLOUD_MAIL_MCP_VERSION dans .env pour épingler une version ;
    # `latest` suit le dernier tag. Le build local passe par docker-compose.dev.yml.
    image: ghcr.io/leolesimple/icloud-mail-mcp:${ICLOUD_MAIL_MCP_VERSION:-latest}
    container_name: icloud-mail-mcp
    env_file:
      - .env
    environment:
      # Quota d'envoi persisté dans le volume : survit aux redémarrages.
      HTTP_HOST: 0.0.0.0
      QUOTA_STATE_PATH: /app/data/send-quota.json
    volumes:
      - icloud-mail-mcp-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    networks:
      - tunnel

volumes:
  icloud-mail-mcp-data:

# Réseau partagé avec le cloudflared qui expose le tunnel. Ce cloudflared est
# géré hors de ce projet (stack tierce) ; le serveur y est simplement rattaché,
# joignable en `http://icloud-mail-mcp:3000`. Le nom du réseau vit dans .env
# (TUNNEL_NETWORK) pour ne pas être commité, et le réseau doit déjà exister :
#   docker network create "$TUNNEL_NETWORK"   # si ce n'est pas déjà le cas
#
# Déploiement autonome (cloudflared embarqué) : ajouter docker-compose.tunnel.yml.
networks:
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:?définir TUNNEL_NETWORK dans .env (nom du réseau Docker partagé avec cloudflared)}
